# ──────────────────────────────────────────────────────────────────────────
# wrangler.toml — Configuration Cloudflare Pages — MaisonCBDVape
# ──────────────────────────────────────────────────────────────────────────

name = "maisoncbdvape"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "public"

# ─── Variables d'environnement ────────────────────────────────────────────
# ✅ Ce projet Pages est en « configuration par fichier » : le tableau de bord
#    indique « managed through wrangler.toml » et y est en lecture seule.
#    Les [vars] et les bindings ci-dessous s'appliquent donc AUSSI en
#    production, au déploiement suivant. Ce fichier fait autorité.
#
# ⚠ Les SECRETS font exception : chiffrés, ils ne peuvent pas vivre ici et
#   restent à saisir dans Cloudflare Pages → Settings → Variables and secrets.
#
# Récapitulatif des valeurs :
#   PLAINTEXT (gérées ici, dans [vars]) :
#     SITE_URL               = https://maisoncbdvape.fr
#       ✅ Basculé le 2026-08-22. La condition posée ici — attendre que le
#         custom domain soit « Active » dans Cloudflare Pages — est remplie :
#         maisoncbdvape.fr et www sont actifs, SSL compris. Tant qu'elle ne
#         l'était pas, il fallait garder https://maisoncbdvape.pages.dev,
#         sinon l'OAuth GitHub de l'admin et les retours de paiement cassaient.
#     MONETICO_ENV           = test   (→ "production" au lancement)
#     MONETICO_TPE           = 7 caractères alphanumériques (n° de TPE virtuel)
#     MONETICO_SOCIETE       = code société fourni à la création du contrat
#     EMAIL_FROM             = MaisonCBDVape <noreply@maisoncbdvape.fr>
#     EMAIL_REPLY_TO         = contact@maisoncbdvape.fr
#     EMAIL_MERCHANT         = vincent.kotowski@ikmail.com,contact@maisoncbdvape.fr
#     GITHUB_OAUTH_CLIENT_ID = Ov23liwMg8Mc7uBdzJj3
#     GITHUB_REPO            = FlowPesci/maisoncbdvape
#     ADMIN_GITHUB_USERS     = FlowPesci
#   SECRETS (chiffrés) :
#     RESEND_API_KEY
#     GITHUB_OAUTH_CLIENT_SECRET
#     MONETICO_CLE_MAC       (clé de sécurité 40 caractères hex — JAMAIS en clair)
#
# ⚠ Monetico — back-office Crédit Mutuel, à renseigner côté banque :
#     URL de retour (notification serveur) : https://maisoncbdvape.fr/api/monetico-notification
#     URL de retour OK / KO                : renseignées dynamiquement par le site

[vars]
SITE_URL               = "https://maisoncbdvape.fr"
MONETICO_ENV           = "test"
MONETICO_TPE           = ""
MONETICO_SOCIETE       = ""
EMAIL_FROM             = "MaisonCBDVape <noreply@maisoncbdvape.fr>"
EMAIL_REPLY_TO         = "contact@maisoncbdvape.fr"
EMAIL_MERCHANT         = "vincent.kotowski@ikmail.com,contact@maisoncbdvape.fr"
GITHUB_OAUTH_CLIENT_ID = "Ov23liwMg8Mc7uBdzJj3"
GITHUB_REPO            = "FlowPesci/maisoncbdvape"
ADMIN_GITHUB_USERS     = "FlowPesci"

# ─── Binding D1 (stocks) ──────────────────────────────────────────────────
# Créer la base :  npx wrangler d1 create maisoncbdvape-stocks
#
# ✅ Ce projet Pages lit sa configuration DEPUIS ce fichier — le tableau de
#    bord Cloudflare affiche « Bindings for this project are being managed
#    through wrangler.toml » et y est en lecture seule. Le binding ci-dessous
#    s'applique donc en production au prochain déploiement, sans manipulation
#    dans l'interface.
[[d1_databases]]
binding = "STOCKS_DB"
database_name = "maisoncbdvape-stocks"
database_id = "eea5faac-df29-4e87-8856-34a987637f41"

# ─── Binding Workers AI (lecture des bons de livraison) ───────────────────
# Aucune ressource à créer : le binding suffit. Offre gratuite de 10 000
# neurones par jour, remise à zéro à 00 h 00 UTC — voir
# docs/etude-reception-marchandise.md pour le calcul du coût réel.
[ai]
binding = "AI"

# ─── Bindings KV (commandes + état OAuth) ─────────────────────────────────
[[kv_namespaces]]
binding = "ORDERS_KV"
id = "912b7534e54b4658a08db0530e2e278b"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "e7ebbd4459e443ae99aa15f76ce30301"

# ─── Bindings R2 (médias : photos produits) ───────────────────────────────
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "tabacgex-media"
