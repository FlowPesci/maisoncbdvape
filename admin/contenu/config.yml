# ──────────────────────────────────────────────────────────────────────────────
# Decap CMS — Configuration admin MaisonCBDVape
# ──────────────────────────────────────────────────────────────────────────────
# Backend : GitHub OAuth custom (auth via /api/auth/login)
# Doc widgets : https://decapcms.org/docs/widgets/
# ──────────────────────────────────────────────────────────────────────────────

backend:
  name: github
  repo: FlowPesci/maisoncbdvape
  branch: main
  base_url: https://maisoncbdvape.fr
  auth_endpoint: /api/auth/login
  commit_messages:
    create: 'Création de "{{collection}} – {{slug}}"'
    update: 'Mise à jour de "{{collection}} – {{slug}}"'
    delete: 'Suppression de "{{collection}} – {{slug}}"'
    uploadMedia: 'Upload image : {{path}}'
    deleteMedia: 'Suppression image : {{path}}'


# Dossier où Decap stocke les images uploadées via le CMS
media_folder: "src/assets/img/produits"
public_folder: "/assets/img/produits"

# Locale française pour l'interface admin
locale: "fr"

# Site URL (sera mis à jour automatiquement au déploiement)
site_url: https://maisoncbdvape.fr
display_url: https://maisoncbdvape.fr
logo_url: https://maisoncbdvape.fr/favicon.svg

# Active l'éditeur de contenu enrichi (markdown) avec sauvegardes automatiques
editor:
  preview: false

collections:

  # ════════════════════════════════════════════════════════════════════════
  # BLOG — un fichier Markdown par article, rendu nativement par Eleventy
  #
  # ⚠ `extension: md` et `format: frontmatter` : le corps de l'article est du
  #   Markdown, pas du JSON. C'est ce qui permet à Eleventy de générer la page
  #   sans analyseur supplémentaire — voir src/_includes/layouts/article.njk.
  #
  # ⚠ Le texte écrit ici passe par `verify:redaction`, au même titre que les
  #   fiches produits : une allégation de santé sur le CBD fait échouer la
  #   construction et l'article ne part pas en ligne. C'est voulu.
  # ════════════════════════════════════════════════════════════════════════
  - name: "articles"
    label: "Blog"
    label_singular: "Article"
    description: "Articles de fond pour le référencement. Publiés sur /blog/ et listés en pied de page."
    folder: "src/blog"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    summary: "{{titre}}"
    sortable_fields: ["date", "titre"]
    fields:
      - label: "Titre"
        name: "titre"
        widget: "string"
        hint: "Le titre de la page, celui que Google affiche. Une phrase claire vaut mieux qu'un jeu de mots."

      - label: "Date de publication"
        name: "date"
        widget: "datetime"
        date_format: "DD/MM/YYYY"
        time_format: false
        picker_utc: false

      - label: "Chapeau"
        name: "chapeau"
        widget: "text"
        required: false
        hint: "Deux ou trois lignes de résumé, affichées sous le titre et dans la liste des articles. Sert aussi de description dans les résultats Google si le champ SEO est vide."

      - label: "Image de couverture"
        name: "image"
        widget: "image"
        required: false
        hint: "Facultative. Affichée en haut de l'article et dans la liste."

      - label: "Auteur"
        name: "auteur"
        widget: "string"
        required: false
        default: "MaisonCBDVape"

      - label: "Article"
        name: "body"
        widget: "markdown"
        hint: >-
          Le texte de l'article. ⚠ Interdiction absolue d'écrire qu'un produit
          CBD soulage, apaise, détend ou aide à dormir — la loi ne permet de
          décrire que ce que le produit EST et ce qu'on perçoit, jamais ce
          qu'il ferait à celui qui le consomme. Un article qui contient ce
          genre de phrase empêche la mise en ligne de TOUT le site jusqu'à
          correction.

      - label: "SEO"
        name: "seo"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "Titre SEO", name: "title", widget: "string", required: false }
          - { label: "Description SEO", name: "description", widget: "text", required: false }

  # ════════════════════════════════════════════════════════════════════════
  # PRODUITS — fichier unique JSON contenant la liste complète
  # ════════════════════════════════════════════════════════════════════════
  - name: "produits"
    label: "Catalogue produits"
    label_singular: "Produit"
    description: "Tous les produits de la boutique. Utilisez les filtres par catégorie sur la gauche."
    folder: "src/data-source/produits"
    create: true
    delete: true
    identifier_field: "id"
    extension: "json"
    format: "json"
    slug: "{{id}}"
    summary: "[{{categorie}}] {{nom}} – {{marque}} ({{prix}} €)"
    sortable_fields: ["categorie", "nom", "marque", "prix"]
    view_filters:
      - label: "CBD"
        field: categorie
        pattern: "cbd"
      - label: "Vape & E-liquides"
        field: categorie
        pattern: "vape"
      - label: "Puffs"
        field: categorie
        pattern: "puffs"
      - label: "Chicha"
        field: categorie
        pattern: "chicha"
      - label: "Accessoires"
        field: categorie
        pattern: "accessoires"
    view_groups:
      - label: "Catégorie"
        field: categorie
      - label: "Actif"
        field: actif
    fields:

      # ─── Identité ──────────────────────────────────────────────
      - label: "Identifiant URL (slug)"
        name: "id"
        widget: "string"
        hint: "Identifiant unique en kebab-case (lettres minuscules + tirets). Ex : kit-box-gen-se-vaporesso. Sert d'URL : /produits/<id>/"
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Uniquement lettres minuscules, chiffres et tirets']

      - label: "Nom du produit"
        name: "nom"
        widget: "string"
        hint: "Affiché en gros titre sur la fiche produit"

      - label: "Marque"
        name: "marque"
        widget: "string"

      - label: "Catégorie"
        name: "categorie"
        widget: "select"
        options:
          - { label: "CBD",               value: "cbd" }
          - { label: "Vape & E-liquides", value: "vape" }
          - { label: "Puffs",             value: "puffs" }
          - { label: "Articles fumeurs",  value: "accessoires" }

      # ⚠ Loi n° 2025-175 du 24 février 2025. Le critère d'interdiction est la
      # quantité d'e-liquide FIXE, pas la batterie : un appareil scellé à port
      # USB-C est interdit. Ne renseigner « Oui » que sur preuve (flacon fourni,
      # réservoir rechargeable, pod remplaçable). « Non » fait échouer le build
      # tant que le produit reste actif — c'est voulu, la vente est interdite.
      - label: "E-liquide rechargeable par le client"
        name: "liquideRemplissable"
        widget: "select"
        required: false
        hint: "Puffs uniquement. La loi interdit la vente d'un appareil à réservoir scellé, même si la batterie se recharge. Dans le doute, laisser « À vérifier » et demander au fournisseur."
        # ⚠ Valeurs en CHAÎNES, pas en booléens. Le widget `select` de Decap
        # n'accepte qu'une chaîne ou un nombre : avec `value: true`, l'éditeur
        # refuse de démarrer en entier — « Error loading the CMS
        # configuration », et plus aucune fiche n'est modifiable.
        options:
          - { label: "Oui — le client peut remettre du liquide", value: "oui" }
          - { label: "Non — réservoir scellé (VENTE INTERDITE)", value: "non" }
          - { label: "À vérifier auprès du fournisseur", value: "" }

      - label: "Sous-catégorie"
        name: "sousCategorie"
        widget: "select"
        required: false
        hint: "Doit appartenir à la catégorie choisie ci-dessus. Laisser vide place le produit uniquement dans la catégorie."
        options:
          - { label: "CBD › Fleurs indoor", value: "fleurs-indoor" }
          - { label: "CBD › Pollens & résines", value: "pollens-resines" }
          - { label: "CBD › Small buds", value: "small-buds" }
          - { label: "CBD › Substituts de tabac", value: "substituts-tabac" }
          - { label: "Puffs › JNR", value: "jnr" }
          - { label: "Puffs › Al Fakher", value: "al-fakher" }
          - { label: "Puffs › Starbuzz", value: "starbuzz" }
          - { label: "Puffs › Adalya", value: "adalya" }
          - { label: "Puffs › Pods & recharges", value: "pods-recharges" }
          - { label: "Vape & E-liquides › Le Petit Verger", value: "e-liquides-petit-verger" }
          - { label: "Vape & E-liquides › Curieux", value: "e-liquides-curieux" }
          - { label: "Vape & E-liquides › Le Petit Gourmet", value: "e-liquides-petit-gourmet" }
          - { label: "Vape & E-liquides › Autres e-liquides", value: "e-liquides-autres" }
          - { label: "Vape & E-liquides › Kits & cigarettes électroniques", value: "kits" }
          - { label: "Vape & E-liquides › Box", value: "box" }
          - { label: "Vape & E-liquides › Clearomiseurs", value: "clearomiseurs" }
          - { label: "Vape & E-liquides › DIY & bases", value: "diy-bases" }
          - { label: "Articles fumeurs › Grinders", value: "grinders" }
          - { label: "Articles fumeurs › Plateaux", value: "plateaux" }
          - { label: "Articles fumeurs › Balances", value: "balances" }
          - { label: "Articles fumeurs › Bangs & verrerie", value: "bangs" }
          - { label: "Articles fumeurs › Cendriers", value: "cendriers" }
          - { label: "Articles fumeurs › Allume-charbons", value: "allume-charbons" }
          - { label: "Articles fumeurs › Boîtes", value: "boites" }

      # ─── Prix & stock ──────────────────────────────────────────
      - label: "Prix (€)"
        name: "prix"
        widget: "number"
        value_type: "float"
        step: 0.01
        min: 0
        hint: >-
          Prix du produit, utilisé seulement s'il n'a PAS de variantes.
          Dès qu'il y a des variantes (grammages, saveurs), ce champ est
          ignoré : le prix affiché devient automatiquement celui de la
          variante la moins chère. Modifier un tarif consiste alors à
          modifier les variantes, plus bas — pas cette case.
          Exception : les fleurs au gramme, où ce champ est le prix
          du gramme et reste à saisir.

      - label: "Prix barré (€)"
        name: "prixBarre"
        widget: "number"
        value_type: "float"
        step: 0.01
        min: 0
        required: false
        hint: "Prix avant promo. Laisser vide si pas de promotion."

      - label: "Devise"
        name: "devise"
        widget: "hidden"
        default: "EUR"

      - label: "Unité de prix"
        name: "unitePrix"
        widget: "string"
        required: false
        hint: 'Ex : "g" pour les fleurs CBD vendues au gramme. Laisser vide si vente à l''unité.'

      - label: "Stock"
        name: "stock"
        widget: "number"
        value_type: "int"
        min: 0
        default: 0

      - label: "Statut stock"
        name: "statutStock"
        widget: "select"
        options:
          - { label: "En stock",     value: "en-stock" }
          - { label: "Stock faible", value: "stock-faible" }
          - { label: "Rupture",      value: "rupture" }
        default: "en-stock"

      # ─── Images ────────────────────────────────────────────────
      - label: "Image principale"
        name: "image"
        widget: "image"
        hint: "Photo principale qui apparaît sur les listes et en miniature de la fiche"

      - label: "Galerie photos"
        name: "galerie"
        widget: "list"
        field: { label: "Photo", name: "photo", widget: "image" }
        hint: "Toutes les photos du produit"
        required: false

      # ─── Description ───────────────────────────────────────────
      - label: "Description courte"
        name: "descriptionCourte"
        widget: "string"
        hint: "1-2 phrases (visible sur les cartes produit et en haut de la fiche)"

      - label: "Description complète"
        name: "description"
        widget: "text"
        hint: "Description longue (paragraphe complet)"
        required: false

      - label: "Points forts"
        name: "pointsForts"
        widget: "list"
        field: { label: "Argument", name: "argument", widget: "string" }
        hint: "Liste à puces des arguments clés du produit"
        required: false

      # ─── Fiche technique ───────────────────────────────────────
      - label: "Fiche technique"
        name: "ficheTechnique"
        widget: "list"
        hint: "Caractéristiques techniques en paires (ex : Puissance / 80W)"
        required: false
        summary: "{{fields.cle}} : {{fields.valeur}}"
        fields:
          - { label: "Caractéristique", name: "cle", widget: "string" }
          - { label: "Valeur", name: "valeur", widget: "string" }

      # ─── Contenu du kit ────────────────────────────────────────
      - label: "Contenu du kit"
        name: "contenuKit"
        widget: "list"
        field: { label: "Élément inclus", name: "element", widget: "string" }
        hint: 'Liste des items inclus (ex : "1× Box", "1× Câble USB-C")'
        required: false

      # ─── Couleurs ──────────────────────────────────────────────
      - label: "Couleurs disponibles"
        name: "couleurs"
        widget: "list"
        summary: "{{fields.nom}}"
        required: false
        fields:
          - { label: "Nom de la couleur", name: "nom", widget: "string" }
          - { label: "Code couleur (hex)", name: "hex", widget: "color", allowInput: true }

      # ─── Variantes ─────────────────────────────────────────────
      - label: "Variantes"
        name: "variantes"
        widget: "list"
        # ⚠ Un `summary` Decap n'interprète que les `{{ }}`. Les balises
        #   `{% if %}` y sont affichées TELLES QUELLES : la ligne repliée
        #   montrait « Space Dream{% if fields.prix %} — 15.99 €{% endif %} »
        #   au commerçant. Constaté le 2026-09-24.
        #   La condition n'a de toute façon plus lieu d'être : une variante
        #   sans prix fait échouer `verify:prix`.
        summary: "{{fields.label}} — {{fields.prix}} €"
        required: false
        hint: "Une entrée par choix ACHETABLE, chacune avec SON PRIX et son stock. CBD : les grammages (2g, 4g, 8g). Puffs et e-liquides : une entrée par saveur. C'est le seul champ que le client peut sélectionner — et c'est ici qu'on modifie un tarif. Une variante sans prix rend le produit impossible à commander."
        fields:
          - { label: "Label", name: "label", widget: "string", hint: "Ex : 1g, 3g, Fraise, Mangue…" }
          - { label: "Prix (€)", name: "prix", widget: "number", value_type: "float", required: false }
          - { label: "Stock", name: "stock", widget: "number", value_type: "int", default: 10 }
          - label: "Photo de cette saveur"
            name: "image"
            widget: "image"
            required: false
            hint: >-
              Facultatif. Si renseignée, la photo principale de la fiche est
              remplacée par celle-ci quand le client choisit cette saveur, et
              elle le suit jusque dans son panier et sa confirmation de
              commande. Laisser vide pour garder la photo du produit —
              inutile sur les fleurs CBD, où le bocal est le même quel que
              soit le grammage.

      # ─── Tags ──────────────────────────────────────────────────
      - label: "Tags"
        name: "tags"
        widget: "select"
        multiple: true
        options:
          - { label: "Bestseller",   value: "bestseller" }
          - { label: "Nouveauté",    value: "nouveaute" }
          - { label: "Hot",          value: "hot" }
          - { label: "Promo",        value: "promo" }
          - { label: "Premium",      value: "premium" }
          - { label: "Indoor",       value: "indoor" }
          - { label: "Best-saveur",  value: "best-saveur" }
          - { label: "Kit complet",  value: "kit-complet" }
          - { label: "Débutant",     value: "debutant" }
        required: false

      # ─── Avis ──────────────────────────────────────────────────
      - label: "Note moyenne (0-5)"
        name: "note"
        widget: "number"
        value_type: "float"
        min: 0
        max: 5
        step: 0.1
        required: false

      - label: "Nombre d'avis"
        name: "nombreAvis"
        widget: "number"
        value_type: "int"
        min: 0
        required: false

      # ─── Méta ──────────────────────────────────────────────────
      - label: "Date d'ajout"
        name: "dateAjout"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: false

      - label: "Produit actif (visible sur le site)"
        name: "actif"
        widget: "boolean"
        default: true
        hint: >-
          Décochez pour retirer un produit de la vente : il disparaît du site,
          des listes et du moteur de recherche, mais sa fiche, ses photos et
          son texte restent intacts — il suffit de recocher pour le remettre
          en ligne. C'est ce qu'il faut faire pour une rupture de stock, une
          fin de série ou un produit saisonnier.
          À préférer à « Supprimer l'entrée », qui efface tout le travail de
          rédaction : une fiche supprimée ne se récupère plus depuis
          l'éditeur.

      # ─── SEO ───────────────────────────────────────────────────
      - label: "SEO"
        name: "seo"
        widget: "object"
        required: false
        fields:
          - { label: "Titre SEO", name: "title", widget: "string", required: false }
          - { label: "Meta description", name: "description", widget: "string", required: false, hint: "150-160 caractères max" }

  - name: "categories"
    label: "Catégories (univers)"
    label_singular: "Catégorie"
    description: "Les 5 univers de la boutique : CBD, Vape, Puffs, Chicha, Accessoires."
    files:
      - file: "src/data-source/categories.json"
        label: "Liste des catégories"
        name: "categories"
        fields:
          - label: "Catégories"
            name: "categories"
            widget: "list"
            summary: "{{fields.nom}}"
            collapsed: true
            fields:
              - { label: "Slug (URL)", name: "slug", widget: "string", pattern: ['^[a-z0-9-]+$', 'Lettres minuscules + tirets'] }
              - { label: "Nom complet", name: "nom", widget: "string" }
              - { label: "Nom court (pour menu)", name: "nomCourt", widget: "string", required: false }
              - { label: "Couleur d'accent", name: "couleur", widget: "select", options: ["green", "violet", "blue", "smoke"] }
              - { label: "Code hex couleur", name: "couleurHex", widget: "color", allowInput: true, required: false }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Image de bannière", name: "image", widget: "image", required: false }
              - { label: "Icône (clé technique)", name: "icone", widget: "string", required: false }
              - { label: "Ordre d'affichage", name: "ordre", widget: "number", value_type: "int", min: 1 }


  # ════════════════════════════════════════════════════════════════════════
  # SITE — config globale (rare modification)
  # ════════════════════════════════════════════════════════════════════════
  - name: "site"
    label: "Configuration du site"
    description: "Coordonnées de la boutique, horaires, réseaux sociaux. À éditer rarement."
    files:
      - file: "src/_data/site.json"
        label: "Infos boutique"
        name: "site"
        fields:
          - { label: "Nom de la boutique", name: "nom", widget: "string" }
          - { label: "Baseline (sous-titre court)", name: "baseline", widget: "string" }
          - { label: "Tagline (slogan)", name: "tagline", widget: "string" }
          - { label: "Description SEO", name: "description", widget: "text" }
          - { label: "URL du site", name: "url", widget: "string" }
          - { label: "Langue (code)", name: "lang", widget: "hidden", default: "fr" }
          - { label: "Locale", name: "locale", widget: "hidden", default: "fr_FR" }

          - label: "Adresse"
            name: "adresse"
            widget: "object"
            fields:
              - { label: "Rue", name: "rue", widget: "string" }
              - { label: "Code postal", name: "codePostal", widget: "string" }
              - { label: "Ville", name: "ville", widget: "string" }
              - { label: "Pays", name: "pays", widget: "string", default: "France" }

          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Téléphone (format affiché)", name: "telephone", widget: "string" }
              - { label: "Téléphone (format E.164)", name: "telephoneE164", widget: "string", hint: "Ex : +33450000000 (utilisé pour les liens 'cliquer pour appeler')" }
              - { label: "Email", name: "email", widget: "string" }

          - label: "Horaires"
            name: "horaires"
            widget: "list"
            summary: "{{fields.jours}} : {{fields.heures}}"
            fields:
              - { label: "Jours", name: "jours", widget: "string" }
              - { label: "Heures", name: "heures", widget: "string" }

          - label: "Réseaux sociaux"
            name: "social"
            widget: "object"
            fields:
              - { label: "Instagram", name: "instagram", widget: "string", required: false }
              - { label: "Facebook",  name: "facebook",  widget: "string", required: false }
              - { label: "TikTok",    name: "tiktok",    widget: "string", required: false }

          - label: "Menu de navigation"
            name: "navigation"
            widget: "list"
            summary: "{{fields.label}} → {{fields.url}}"
            fields:
              - { label: "Libellé", name: "label", widget: "string" }
              - { label: "URL",     name: "url",   widget: "string" }
              - { label: "Couleur d'accent", name: "couleur", widget: "select", options: ["green", "violet", "blue", "smoke"] }
